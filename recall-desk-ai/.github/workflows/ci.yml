name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install ruff

      - name: Lint
        working-directory: backend
        run: ruff check app tests migrations --select E9,F,B --ignore B008

      # No API keys and no MySQL needed: db-marked tests skip themselves.
      - name: Test
        working-directory: backend
        run: pytest -q

      - name: Import check
        working-directory: backend
        run: python -c "import app.main; print('app imports ok')"

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build
